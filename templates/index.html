<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YT Audio Ripper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #ff4747;
    --text: #f0f0f0;
    --muted: #6a6a6a;
    --success: #47ffb2;
    --radius: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -0.03em;
    color: var(--accent);
  }

  .logo span {
    color: var(--text);
  }

  .tagline {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Input area */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 0.75rem;
    resize: vertical;
    min-height: 100px;
    transition: border-color 0.2s;
    outline: none;
    line-height: 1.6;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea::placeholder {
    color: var(--muted);
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  button {
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: none;
    border-radius: var(--radius);
    padding: 0.6rem 1.2rem;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d0d0d;
    font-weight: 700;
  }

  .btn-primary:hover { background: #d4eb30; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-download-all {
    background: var(--success);
    color: #0d0d0d;
    font-weight: 700;
  }

  .btn-download-all:hover { background: #30e89e; }

  /* Error banner */
  .error-banner {
    background: rgba(255, 71, 71, 0.1);
    border: 1px solid var(--accent2);
    border-radius: var(--radius);
    color: var(--accent2);
    font-size: 0.75rem;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    display: none;
  }

  /* Progress */
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
    display: none;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .progress-label .pct {
    color: var(--accent);
    font-weight: 700;
  }

  .progress-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .progress-fill.done { background: var(--success); }

  .status-line {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .issues-section {
    background: rgba(255, 71, 71, 0.08);
    border: 1px solid rgba(255, 71, 71, 0.35);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1rem;
    display: none;
  }

  .issues-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }

  .issues-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent2);
  }

  .issue-row {
    border: 1px solid rgba(255, 71, 71, 0.22);
    background: rgba(0, 0, 0, 0.2);
    border-radius: var(--radius);
    padding: 0.55rem 0.7rem;
    margin-bottom: 0.4rem;
    font-size: 0.72rem;
    color: #ffd9d9;
  }

  .issue-row:last-child { margin-bottom: 0; }

  .issue-meta {
    color: #ff9f9f;
    font-size: 0.66rem;
    margin-top: 0.18rem;
  }

  .copy-msg {
    margin-top: 0.55rem;
    font-size: 0.65rem;
    color: var(--muted);
    min-height: 1em;
  }

  /* Preview */
  .preview-section {
    display: none;
    margin-bottom: 1rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .badge {
    font-size: 0.65rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.2rem 0.6rem;
    color: var(--accent);
    font-weight: 700;
  }

  .playlist-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .playlist-header:hover { background: var(--surface2); }

  .playlist-title-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .playlist-icon { font-size: 1rem; }

  .track-count {
    font-size: 0.65rem;
    color: var(--muted);
    margin-left: 0.25rem;
  }

  .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.2s;
  }

  .chevron.open { transform: rotate(90deg); }

  .track-list {
    display: none;
    max-height: 220px;
    overflow-y: auto;
  }

  .track-list.open { display: block; }

  .track-list::-webkit-scrollbar { width: 4px; }
  .track-list::-webkit-scrollbar-track { background: var(--surface); }
  .track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .track-item:last-child { border-bottom: none; }
  .track-num { color: var(--border); font-size: 0.65rem; min-width: 1.5rem; text-align: right; }
  .track-name { color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    font-size: 0.8rem;
  }

  .video-card .icon { font-size: 1.1rem; flex-shrink: 0; }
  .video-card .info { flex: 1; min-width: 0; }
  .video-card .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-card .meta { font-size: 0.65rem; color: var(--muted); margin-top: 0.15rem; }

  .error-card {
    background: rgba(255,71,71,0.08);
    border: 1px solid rgba(255,71,71,0.3);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    color: var(--accent2);
    margin-bottom: 0.5rem;
  }

  /* Library manager */
  .downloads-section {
    display: none;
  }

  .library-toolbar {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.6rem;
  }

  .path-chip {
    font-size: 0.65rem;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem 0.6rem;
    margin-bottom: 0.75rem;
    display: inline-block;
  }

  .library-msg {
    display: none;
    font-size: 0.68rem;
    margin-bottom: 0.6rem;
    padding: 0.5rem 0.7rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(71, 255, 178, 0.07);
    color: var(--success);
  }

  .library-msg.error {
    background: rgba(255, 71, 71, 0.09);
    color: var(--accent2);
    border-color: rgba(255, 71, 71, 0.4);
  }

  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.4rem;
    font-size: 0.75rem;
    gap: 0.75rem;
  }

  .file-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .file-actions {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .file-dl-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.7rem;
    font-size: 0.65rem;
    flex-shrink: 0;
  }

  .file-dl-btn:hover { border-color: var(--accent); color: var(--accent); }

  .meta-editor {
    display: none;
    margin-top: 0.8rem;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius);
    padding: 0.9rem;
  }

  .meta-title {
    font-family: 'Syne', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .meta-grid {
    display: grid;
    gap: 0.55rem;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    margin-bottom: 0.6rem;
  }

  .meta-grid input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    padding: 0.5rem 0.6rem;
    outline: none;
  }

  .meta-grid input:focus {
    border-color: var(--accent);
  }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }

  /* Footer */
  footer {
    margin-top: 3rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    font-size: 0.65rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--success); margin-right: 0.4rem; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">YT<span>Rip</span></div>
    <div class="tagline">YouTube → MP3 · yt-dlp powered</div>
  </header>

  <div class="input-section">
    <label>YouTube URLs — videos or playlists, one per line</label>
    <textarea id="urls" rows="4" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/playlist?list=..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="btn-preview" onclick="fetchInfo()">Preview</button>
      <button class="btn-secondary" id="btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div id="error-banner" class="error-banner"></div>

  <div id="progress-section" class="progress-section">
    <div class="progress-label">
      <span id="progress-stage">Downloading</span>
      <span class="pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status-line" id="status-line">Starting…</div>
  </div>

  <div id="issues-section" class="issues-section">
    <div class="issues-head">
      <div class="issues-title" id="issues-title">Issues</div>
      <button class="btn-secondary" id="btn-copy-report" onclick="copyErrorReport()" style="font-size:0.64rem;padding:0.28rem 0.62rem;">Copy Error Report</button>
    </div>
    <div id="issues-list"></div>
    <div id="copy-msg" class="copy-msg"></div>
  </div>

  <div id="preview-section" class="preview-section">
    <div class="section-header">
      <div class="section-title">Preview</div>
      <div id="total-badge" class="badge"></div>
    </div>
    <div id="preview-content"></div>
    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn-download-all" id="btn-download" onclick="startDownload()">↓ Download All as MP3</button>
    </div>
  </div>

  <div id="downloads-section" class="downloads-section">
    <div class="section-header" style="margin-top:1.5rem;">
      <div class="section-title">Library</div>
      <button class="btn-secondary" onclick="loadLibrary(currentLibraryPath)" style="font-size:0.65rem;padding:0.3rem 0.7rem;">Refresh</button>
    </div>
    <div class="library-toolbar">
      <button class="btn-secondary" onclick="goLibraryUp()" style="font-size:0.65rem;padding:0.3rem 0.7rem;">Up</button>
      <button class="btn-secondary" onclick="createFolder()" style="font-size:0.65rem;padding:0.3rem 0.7rem;">New Folder</button>
    </div>
    <div id="library-path" class="path-chip">/</div>
    <div id="library-msg" class="library-msg"></div>
    <div id="files-list"></div>
    <div id="meta-editor" class="meta-editor">
      <div class="meta-title">Edit Metadata</div>
      <div id="meta-file" class="path-chip" style="margin-bottom:0.7rem;"></div>
      <div class="meta-grid">
        <input id="meta-title" placeholder="Title"/>
        <input id="meta-artist" placeholder="Artist"/>
        <input id="meta-album" placeholder="Album"/>
        <input id="meta-track" placeholder="Track"/>
        <input id="meta-year" placeholder="Year"/>
        <input id="meta-genre" placeholder="Genre"/>
      </div>
      <div class="btn-row" style="margin-top:0.2rem;">
        <button class="btn-primary" onclick="saveMetadata()">Save Metadata</button>
        <button class="btn-secondary" onclick="closeMetadataEditor()">Cancel</button>
      </div>
    </div>
  </div>

  <footer>
    <span><span class="dot"></span>Flask + yt-dlp backend</span>
    <span>MP3 · 192kbps</span>
  </footer>
</div>

<script>
  let currentTaskId = null;
  let latestTaskStatus = null;
  let currentLibraryPath = "";
  let editingSongPath = null;
  const ACTIVE_STATES = new Set(["queued", "preparing", "downloading", "retrying", "pending"]);

  function isActiveStatus(status) {
    return ACTIVE_STATES.has(status);
  }

  function showError(msg) {
    const el = document.getElementById("error-banner");
    el.textContent = "⚠ " + msg;
    el.style.display = "block";
  }

  function clearError() {
    const el = document.getElementById("error-banner");
    el.style.display = "none";
    el.textContent = "";
  }

  function showLibraryMsg(msg, isError=false) {
    const el = document.getElementById("library-msg");
    el.textContent = msg;
    el.style.display = "block";
    el.classList.toggle("error", !!isError);
  }

  function hideLibraryMsg() {
    const el = document.getElementById("library-msg");
    el.style.display = "none";
    el.textContent = "";
    el.classList.remove("error");
  }

  function parentPath(path) {
    if (!path) return "";
    const parts = path.split("/").filter(Boolean);
    parts.pop();
    return parts.join("/");
  }

  async function fetchJson(url, options={}) {
    const resp = await fetch(url, options);
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || "Request failed");
    }
    return data;
  }

  function clearAll() {
    document.getElementById("urls").value = "";
    document.getElementById("preview-section").style.display = "none";
    document.getElementById("downloads-section").style.display = "none";
    closeMetadataEditor();
    document.getElementById("issues-section").style.display = "none";
    document.getElementById("issues-list").innerHTML = "";
    document.getElementById("copy-msg").textContent = "";
    hideLibraryMsg();
    currentTaskId = null;
    currentLibraryPath = "";
    try { localStorage.removeItem("activeTaskId"); } catch (e) { /* ignore */ }
    latestTaskStatus = null;
    clearError();
  }

  function setTaskId(taskId) {
    currentTaskId = taskId || null;
    try {
      if (currentTaskId) {
        localStorage.setItem("activeTaskId", currentTaskId);
      } else {
        localStorage.removeItem("activeTaskId");
      }
    } catch (e) { /* ignore */ }
  }

  function formatSpeed(bytesPerSec) {
    if (!bytesPerSec || bytesPerSec <= 0) return "";
    const units = ["B/s", "KB/s", "MB/s", "GB/s"];
    let n = bytesPerSec;
    let idx = 0;
    while (n >= 1024 && idx < units.length - 1) {
      n /= 1024;
      idx += 1;
    }
    return `${n.toFixed(n >= 100 ? 0 : 1)} ${units[idx]}`;
  }

  function formatEta(seconds) {
    if (seconds == null || seconds < 0) return "";
    const s = Math.floor(seconds % 60);
    const m = Math.floor((seconds / 60) % 60);
    const h = Math.floor(seconds / 3600);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
  }

  function renderIssues(task) {
    const section = document.getElementById("issues-section");
    const list = document.getElementById("issues-list");
    const title = document.getElementById("issues-title");
    const errors = (task && task.errors) || [];

    if (!errors.length) {
      section.style.display = "none";
      list.innerHTML = "";
      return;
    }

    title.textContent = `Issues (${errors.length})`;
    list.innerHTML = errors.map(e => {
      const name = e.title || e.url || "Unknown item";
      const type = e.error_type || "unknown";
      return `<div class="issue-row"><div>${esc(name)}</div><div class="issue-meta">[${esc(type)}] ${esc(e.message || "Download failed")}</div></div>`;
    }).join("");
    section.style.display = "block";
  }

  function buildErrorReport(task) {
    const errors = (task && task.errors) || [];
    const lines = [];
    lines.push(`Task: ${currentTaskId || "unknown"}`);
    lines.push(`Phase: ${task.phase || task.status || "unknown"}`);
    lines.push(`Result: ${task.summary || "n/a"}`);
    lines.push(`Totals: total=${task.total || 0} completed=${task.completed || 0} ok=${task.succeeded || 0} skipped=${task.skipped || 0} failed=${task.failed || 0}`);
    lines.push(`LastError: ${task.last_error || "none"}`);
    lines.push("Failures:");
    if (!errors.length) {
      lines.push("- none");
    } else {
      errors.forEach(e => {
        lines.push(`- [${e.error_type || "unknown"}] ${e.url || "unknown"}: ${e.message || "Download failed"}`);
      });
    }
    lines.push(`Generated: ${new Date().toISOString()}`);
    return lines.join("\n");
  }

  async function copyErrorReport() {
    const msg = document.getElementById("copy-msg");
    if (!latestTaskStatus) {
      msg.textContent = "No task data available yet.";
      return;
    }
    const report = buildErrorReport(latestTaskStatus);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(report);
      } else {
        const ta = document.createElement("textarea");
        ta.value = report;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      msg.textContent = "Error report copied to clipboard.";
    } catch (err) {
      msg.textContent = "Copy failed. Open browser console for report text.";
      console.log(report);
    }
  }

  function formatDuration(secs) {
    if (!secs) return "";
    const m = Math.floor(secs / 60), s = secs % 60;
    return `${m}:${String(s).padStart(2,"0")}`;
  }

  async function fetchInfo() {
    const urlsText = document.getElementById("urls").value.trim();
    clearError();
    document.getElementById("preview-section").style.display = "none";
    if (!urlsText) { showError("Paste at least one URL."); return; }

    const urls = urlsText.split("\n").map(u => u.trim()).filter(Boolean);
    const btn = document.getElementById("btn-preview");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading…';

    try {
      const resp = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls })
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || "Request failed"); return; }
      renderPreview(data);
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Preview";
    }
  }

  function renderPreview(results) {
    const content = document.getElementById("preview-content");
    let html = "";
    let total = 0;

    results.forEach(r => {
      if (r.type === "playlist") {
        total += r.count;
        const entries = r.entries.map((e, i) =>
          `<div class="track-item">
            <span class="track-num">${String(i+1).padStart(2,"0")}</span>
            <span class="track-name">${esc(e.title)}</span>
          </div>`
        ).join("");
        const pid = "pl_" + Math.random().toString(36).slice(2);
        html += `
          <div class="playlist-block">
            <div class="playlist-header" onclick="toggleTracks('${pid}', this)">
              <div class="playlist-title-row">
                <span class="playlist-icon">📁</span>
                <span>${esc(r.playlist_title)}</span>
                <span class="track-count">${r.count} tracks</span>
              </div>
              <span class="chevron" id="chev_${pid}">▶</span>
            </div>
            <div class="track-list" id="${pid}">${entries}</div>
          </div>`;
      } else if (r.type === "video") {
        total += 1;
        html += `
          <div class="video-card">
            <span class="icon">🎵</span>
            <div class="info">
              <div class="title">${esc(r.title)}</div>
              <div class="meta">${r.uploader ? esc(r.uploader) + " · " : ""}${formatDuration(r.duration)}</div>
            </div>
          </div>`;
      } else {
        html += `<div class="error-card">✕ ${esc(r.url)}<br><small>${esc(r.error)}</small></div>`;
      }
    });

    content.innerHTML = html;
    document.getElementById("total-badge").textContent = total + " track" + (total !== 1 ? "s" : "");
    document.getElementById("preview-section").style.display = "block";
  }

  function toggleTracks(id, header) {
    const list = document.getElementById(id);
    const chev = document.getElementById("chev_" + id);
    list.classList.toggle("open");
    chev.classList.toggle("open");
  }

  async function startDownload() {
    const urlsText = document.getElementById("urls").value.trim();
    const urls = urlsText.split("\n").map(u => u.trim()).filter(Boolean);
    if (!urls.length) return;
    clearError();

    const btn = document.getElementById("btn-download");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Starting…';

    const ps = document.getElementById("progress-section");
    const fill = document.getElementById("progress-fill");
    const pct = document.getElementById("progress-pct");
    const stage = document.getElementById("progress-stage");
    const statusLine = document.getElementById("status-line");

    ps.style.display = "block";
    document.getElementById("issues-section").style.display = "none";
    document.getElementById("issues-list").innerHTML = "";
    document.getElementById("copy-msg").textContent = "";
    latestTaskStatus = null;
    fill.style.width = "0%";
    fill.className = "progress-fill";
    pct.textContent = "0%";
    stage.textContent = "Queued";
    statusLine.textContent = "Starting…";

    try {
      const resp = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls })
      });
      const data = await resp.json();
      if (!resp.ok || data.error) {
        showError(data.error || "Failed to start download");
        ps.style.display = "none";
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        return;
      }
      currentTaskId = data.task_id;
      setTaskId(data.task_id);
      pollStatus(btn);
    } catch (err) {
      showError(err.message);
      ps.style.display = "none";
      btn.disabled = false;
      btn.textContent = "↓ Download All as MP3";
    }
  }

  async function pollStatus(btn) {
    if (!currentTaskId) return;

    const fill = document.getElementById("progress-fill");
    const pctEl = document.getElementById("progress-pct");
    const stage = document.getElementById("progress-stage");
    const statusLine = document.getElementById("status-line");

    try {
      const resp = await fetch(`/api/status/${currentTaskId}`);
      const data = await resp.json();
      latestTaskStatus = data;

      const p = data.progress || 0;
      fill.style.width = p + "%";
      pctEl.textContent = p + "%";

      const currentName = data.current_item || data.current_file;
      const detailBits = [];
      if (data.current_item_pct && data.current_item_pct > 0) detailBits.push(`${data.current_item_pct}%`);
      const speed = formatSpeed(data.current_speed);
      if (speed) detailBits.push(speed);
      const eta = formatEta(data.eta_seconds);
      if (eta) detailBits.push(`ETA ${eta}`);
      if (currentName) {
        statusLine.textContent = `↓ ${currentName}${detailBits.length ? " · " + detailBits.join(" · ") : ""}`;
      } else if (data.summary) {
        statusLine.textContent = data.summary;
      }
      if (data.total > 0) {
        const skipped = data.skipped || 0;
        stage.textContent = `Track ${data.completed || 0} / ${data.total}${skipped ? ` · Skipped ${skipped}` : ""}`;
      } else if (data.phase) {
        stage.textContent = data.phase.charAt(0).toUpperCase() + data.phase.slice(1);
      }

      if (data.summary && !currentName) {
        statusLine.textContent = data.summary;
      }

      renderIssues(data);

      if (isActiveStatus(data.status)) {
        setTimeout(() => pollStatus(btn), 800);
      } else if (data.status === "finished") {
        fill.style.width = "100%";
        fill.classList.add("done");
        pctEl.textContent = "100%";
        stage.textContent = "Complete";
        statusLine.textContent = "All downloads finished ✓";
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        setTimeout(() => {
          document.getElementById("progress-section").style.display = "none";
        }, 3000);
        setTaskId(null);
        loadLibrary(currentLibraryPath);
      } else if (data.status === "finished_with_errors") {
        fill.style.width = "100%";
        pctEl.textContent = "100%";
        stage.textContent = "Complete with issues";
        statusLine.textContent = data.summary || `Completed with ${data.failed || 0} failures.`;
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        showError(data.summary || "Download finished with errors.");
        setTaskId(null);
        loadLibrary(currentLibraryPath);
      } else if (data.status === "error") {
        showError(data.error || "Download failed");
        renderIssues(data);
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        setTaskId(null);
      }
    } catch (err) {
      setTimeout(() => pollStatus(btn), 1500);
    }
  }

  async function restoreActiveTask() {
    const btn = document.getElementById("btn-download");
    const ps = document.getElementById("progress-section");
    const storedTaskId = (() => {
      try { return localStorage.getItem("activeTaskId"); } catch (e) { return null; }
    })();

    if (storedTaskId) {
      setTaskId(storedTaskId);
      ps.style.display = "block";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Resuming…';
      pollStatus(btn);
      return;
    }

    try {
      const resp = await fetch("/api/tasks?active=1");
      if (!resp.ok) return;
      const tasks = await resp.json();
      if (!tasks.length) return;

      setTaskId(tasks[0].task_id);
      ps.style.display = "block";
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Resuming…';
      pollStatus(btn);
    } catch (e) {
      /* ignore */
    }
  }

  async function loadLibrary(path="") {
    const section = document.getElementById("downloads-section");
    const list = document.getElementById("files-list");
    const chip = document.getElementById("library-path");
    try {
      const data = await fetchJson(`/api/library?path=${encodeURIComponent(path)}`);
      currentLibraryPath = data.path || "";
      chip.textContent = "/" + currentLibraryPath;

      const rows = [];
      for (const folder of data.folders || []) {
        rows.push(`
          <div class="file-row">
            <span class="file-name">📁 ${esc(folder.name)}</span>
            <div class="file-actions">
              <button class="file-dl-btn btn-secondary" data-action="open-folder" data-path="${encodeURIComponent(folder.path)}">Open</button>
              <button class="file-dl-btn btn-secondary" data-action="rename" data-path="${encodeURIComponent(folder.path)}">Rename</button>
              <button class="file-dl-btn btn-secondary" data-action="move" data-path="${encodeURIComponent(folder.path)}">Move</button>
              <button class="file-dl-btn btn-secondary" data-action="delete" data-path="${encodeURIComponent(folder.path)}">Delete</button>
            </div>
          </div>
        `);
      }

      for (const file of data.files || []) {
        rows.push(`
          <div class="file-row">
            <span class="file-name">🎵 ${esc(file.name)}</span>
            <div class="file-actions">
              <button class="file-dl-btn btn-secondary" data-action="edit-meta" data-path="${encodeURIComponent(file.path)}">Metadata</button>
              <button class="file-dl-btn btn-secondary" data-action="rename" data-path="${encodeURIComponent(file.path)}">Rename</button>
              <button class="file-dl-btn btn-secondary" data-action="move" data-path="${encodeURIComponent(file.path)}">Move</button>
              <button class="file-dl-btn btn-secondary" data-action="delete" data-path="${encodeURIComponent(file.path)}">Delete</button>
              <a href="/api/library/download?path=${encodeURIComponent(file.path)}" download>
                <button class="file-dl-btn btn-secondary">Save</button>
              </a>
            </div>
          </div>
        `);
      }

      if (!rows.length) {
        rows.push('<div class="file-row"><span class="file-name">No folders or songs in this location yet.</span></div>');
      }

      list.innerHTML = rows.join("");
      section.style.display = "block";
      hideLibraryMsg();
      wireLibraryButtons();
    } catch (e) {
      section.style.display = "none";
      showError(e.message);
    }
  }

  function wireLibraryButtons() {
    const list = document.getElementById("files-list");
    list.querySelectorAll("button[data-action]").forEach(btn => {
      btn.addEventListener("click", async (ev) => {
        ev.preventDefault();
        const action = btn.dataset.action;
        const path = decodeURIComponent(btn.dataset.path || "");
        if (action === "open-folder") {
          loadLibrary(path);
        } else if (action === "rename") {
          await renamePath(path);
        } else if (action === "move") {
          await movePath(path);
        } else if (action === "delete") {
          await deletePath(path);
        } else if (action === "edit-meta") {
          await openMetadataEditor(path);
        }
      });
    });
  }

  function goLibraryUp() {
    loadLibrary(parentPath(currentLibraryPath));
  }

  async function createFolder() {
    const name = prompt("New folder name:");
    if (!name) return;
    try {
      await fetchJson("/api/library/folder", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ parent_path: currentLibraryPath, name })
      });
      showLibraryMsg(`Folder created: ${name}`);
      loadLibrary(currentLibraryPath);
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  async function renamePath(path) {
    const currentName = path.split("/").filter(Boolean).pop() || path;
    const newName = prompt("Rename to:", currentName);
    if (!newName || newName === currentName) return;
    try {
      await fetchJson("/api/library/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, new_name: newName })
      });
      showLibraryMsg(`Renamed to ${newName}`);
      closeMetadataEditor();
      loadLibrary(currentLibraryPath);
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  async function movePath(path) {
    const target = prompt("Move to folder path (relative to library root):", currentLibraryPath || "");
    if (target == null) return;
    try {
      await fetchJson("/api/library/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_path: path, target_dir: target.trim() })
      });
      showLibraryMsg("Moved successfully");
      closeMetadataEditor();
      loadLibrary(currentLibraryPath);
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  async function deletePath(path) {
    const ok = confirm(`Delete '${path}'? This cannot be undone.`);
    if (!ok) return;
    try {
      await fetchJson(`/api/library/path?path=${encodeURIComponent(path)}`, { method: "DELETE" });
      showLibraryMsg(`Deleted: ${path}`);
      if (editingSongPath === path) closeMetadataEditor();
      loadLibrary(currentLibraryPath);
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  async function openMetadataEditor(path) {
    try {
      const data = await fetchJson(`/api/library/song?path=${encodeURIComponent(path)}`);
      editingSongPath = data.path;
      document.getElementById("meta-file").textContent = data.path;
      document.getElementById("meta-title").value = data.metadata.title || "";
      document.getElementById("meta-artist").value = data.metadata.artist || "";
      document.getElementById("meta-album").value = data.metadata.album || "";
      document.getElementById("meta-track").value = data.metadata.track || "";
      document.getElementById("meta-year").value = data.metadata.year || "";
      document.getElementById("meta-genre").value = data.metadata.genre || "";
      document.getElementById("meta-editor").style.display = "block";
      hideLibraryMsg();
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  function closeMetadataEditor() {
    editingSongPath = null;
    document.getElementById("meta-editor").style.display = "none";
    document.getElementById("meta-file").textContent = "";
  }

  async function saveMetadata() {
    if (!editingSongPath) return;
    const metadata = {
      title: document.getElementById("meta-title").value,
      artist: document.getElementById("meta-artist").value,
      album: document.getElementById("meta-album").value,
      track: document.getElementById("meta-track").value,
      year: document.getElementById("meta-year").value,
      genre: document.getElementById("meta-genre").value,
    };
    try {
      await fetchJson("/api/library/song", {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: editingSongPath, metadata })
      });
      showLibraryMsg("Metadata saved");
      loadLibrary(currentLibraryPath);
    } catch (e) {
      showLibraryMsg(e.message, true);
    }
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  // Load any existing files on page load
  loadLibrary("");
  restoreActiveTask();
</script>
