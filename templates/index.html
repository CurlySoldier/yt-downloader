<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>YT Audio Ripper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #ff4747;
    --text: #f0f0f0;
    --muted: #6a6a6a;
    --success: #47ffb2;
    --radius: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.25rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.75rem;
    letter-spacing: -0.03em;
    color: var(--accent);
  }

  .logo span {
    color: var(--text);
  }

  .tagline {
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  /* Input area */
  .input-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  label {
    display: block;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 0.6rem;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    padding: 0.75rem;
    resize: vertical;
    min-height: 100px;
    transition: border-color 0.2s;
    outline: none;
    line-height: 1.6;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea::placeholder {
    color: var(--muted);
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.75rem;
    margin-top: 0.75rem;
  }

  button {
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: none;
    border-radius: var(--radius);
    padding: 0.6rem 1.2rem;
    transition: all 0.15s;
  }

  .btn-primary {
    background: var(--accent);
    color: #0d0d0d;
    font-weight: 700;
  }

  .btn-primary:hover { background: #d4eb30; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-download-all {
    background: var(--success);
    color: #0d0d0d;
    font-weight: 700;
  }

  .btn-download-all:hover { background: #30e89e; }

  /* Error banner */
  .error-banner {
    background: rgba(255, 71, 71, 0.1);
    border: 1px solid var(--accent2);
    border-radius: var(--radius);
    color: var(--accent2);
    font-size: 0.75rem;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
    display: none;
  }

  /* Progress */
  .progress-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
    display: none;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .progress-label .pct {
    color: var(--accent);
    font-weight: 700;
  }

  .progress-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .progress-fill.done { background: var(--success); }

  .status-line {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.6rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Preview */
  .preview-section {
    display: none;
    margin-bottom: 1rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .section-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .badge {
    font-size: 0.65rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 0.2rem 0.6rem;
    color: var(--accent);
    font-weight: 700;
  }

  .playlist-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.75rem;
    overflow: hidden;
  }

  .playlist-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }

  .playlist-header:hover { background: var(--surface2); }

  .playlist-title-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .playlist-icon { font-size: 1rem; }

  .track-count {
    font-size: 0.65rem;
    color: var(--muted);
    margin-left: 0.25rem;
  }

  .chevron {
    color: var(--muted);
    font-size: 0.7rem;
    transition: transform 0.2s;
  }

  .chevron.open { transform: rotate(90deg); }

  .track-list {
    display: none;
    max-height: 220px;
    overflow-y: auto;
  }

  .track-list.open { display: block; }

  .track-list::-webkit-scrollbar { width: 4px; }
  .track-list::-webkit-scrollbar-track { background: var(--surface); }
  .track-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }

  .track-item:last-child { border-bottom: none; }
  .track-num { color: var(--border); font-size: 0.65rem; min-width: 1.5rem; text-align: right; }
  .track-name { color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .video-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.9rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.5rem;
    font-size: 0.8rem;
  }

  .video-card .icon { font-size: 1.1rem; flex-shrink: 0; }
  .video-card .info { flex: 1; min-width: 0; }
  .video-card .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-card .meta { font-size: 0.65rem; color: var(--muted); margin-top: 0.15rem; }

  .error-card {
    background: rgba(255,71,71,0.08);
    border: 1px solid rgba(255,71,71,0.3);
    border-radius: var(--radius);
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    color: var(--accent2);
    margin-bottom: 0.5rem;
  }

  /* Downloads list */
  .downloads-section {
    display: none;
  }

  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.65rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 0.4rem;
    font-size: 0.75rem;
    gap: 0.75rem;
  }

  .file-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .file-dl-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.7rem;
    font-size: 0.65rem;
    flex-shrink: 0;
  }

  .file-dl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 0.4rem;
  }

  /* Footer */
  footer {
    margin-top: 3rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    font-size: 0.65rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--success); margin-right: 0.4rem; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">YT<span>Rip</span></div>
    <div class="tagline">YouTube → MP3 · yt-dlp powered</div>
  </header>

  <div class="input-section">
    <label>YouTube URLs — videos or playlists, one per line</label>
    <textarea id="urls" rows="4" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/playlist?list=..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" id="btn-preview" onclick="fetchInfo()">Preview</button>
      <button class="btn-secondary" id="btn-clear" onclick="clearAll()">Clear</button>
    </div>
  </div>

  <div id="error-banner" class="error-banner"></div>

  <div id="progress-section" class="progress-section">
    <div class="progress-label">
      <span id="progress-stage">Downloading</span>
      <span class="pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="status-line" id="status-line">Starting…</div>
  </div>

  <div id="preview-section" class="preview-section">
    <div class="section-header">
      <div class="section-title">Preview</div>
      <div id="total-badge" class="badge"></div>
    </div>
    <div id="preview-content"></div>
    <div class="btn-row" style="margin-top:1rem;">
      <button class="btn-download-all" id="btn-download" onclick="startDownload()">↓ Download All as MP3</button>
    </div>
  </div>

  <div id="downloads-section" class="downloads-section">
    <div class="section-header" style="margin-top:1.5rem;">
      <div class="section-title">Downloaded Files</div>
      <button class="btn-secondary" onclick="refreshFiles()" style="font-size:0.65rem;padding:0.3rem 0.7rem;">Refresh</button>
    </div>
    <div id="files-list"></div>
  </div>

  <footer>
    <span><span class="dot"></span>Flask + yt-dlp backend</span>
    <span>MP3 · 192kbps</span>
  </footer>
</div>

<script>
  let currentTaskId = null;

  function showError(msg) {
    const el = document.getElementById("error-banner");
    el.textContent = "⚠ " + msg;
    el.style.display = "block";
  }

  function clearError() {
    const el = document.getElementById("error-banner");
    el.style.display = "none";
    el.textContent = "";
  }

  function clearAll() {
    document.getElementById("urls").value = "";
    document.getElementById("preview-section").style.display = "none";
    document.getElementById("downloads-section").style.display = "none";
    clearError();
  }

  function formatDuration(secs) {
    if (!secs) return "";
    const m = Math.floor(secs / 60), s = secs % 60;
    return `${m}:${String(s).padStart(2,"0")}`;
  }

  async function fetchInfo() {
    const urlsText = document.getElementById("urls").value.trim();
    clearError();
    document.getElementById("preview-section").style.display = "none";
    if (!urlsText) { showError("Paste at least one URL."); return; }

    const urls = urlsText.split("\n").map(u => u.trim()).filter(Boolean);
    const btn = document.getElementById("btn-preview");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Loading…';

    try {
      const resp = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls })
      });
      const data = await resp.json();
      if (!resp.ok) { showError(data.error || "Request failed"); return; }
      renderPreview(data);
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Preview";
    }
  }

  function renderPreview(results) {
    const content = document.getElementById("preview-content");
    let html = "";
    let total = 0;

    results.forEach(r => {
      if (r.type === "playlist") {
        total += r.count;
        const entries = r.entries.map((e, i) =>
          `<div class="track-item">
            <span class="track-num">${String(i+1).padStart(2,"0")}</span>
            <span class="track-name">${esc(e.title)}</span>
          </div>`
        ).join("");
        const pid = "pl_" + Math.random().toString(36).slice(2);
        html += `
          <div class="playlist-block">
            <div class="playlist-header" onclick="toggleTracks('${pid}', this)">
              <div class="playlist-title-row">
                <span class="playlist-icon">📁</span>
                <span>${esc(r.playlist_title)}</span>
                <span class="track-count">${r.count} tracks</span>
              </div>
              <span class="chevron" id="chev_${pid}">▶</span>
            </div>
            <div class="track-list" id="${pid}">${entries}</div>
          </div>`;
      } else if (r.type === "video") {
        total += 1;
        html += `
          <div class="video-card">
            <span class="icon">🎵</span>
            <div class="info">
              <div class="title">${esc(r.title)}</div>
              <div class="meta">${r.uploader ? esc(r.uploader) + " · " : ""}${formatDuration(r.duration)}</div>
            </div>
          </div>`;
      } else {
        html += `<div class="error-card">✕ ${esc(r.url)}<br><small>${esc(r.error)}</small></div>`;
      }
    });

    content.innerHTML = html;
    document.getElementById("total-badge").textContent = total + " track" + (total !== 1 ? "s" : "");
    document.getElementById("preview-section").style.display = "block";
  }

  function toggleTracks(id, header) {
    const list = document.getElementById(id);
    const chev = document.getElementById("chev_" + id);
    list.classList.toggle("open");
    chev.classList.toggle("open");
  }

  async function startDownload() {
    const urlsText = document.getElementById("urls").value.trim();
    const urls = urlsText.split("\n").map(u => u.trim()).filter(Boolean);
    if (!urls.length) return;
    clearError();

    const btn = document.getElementById("btn-download");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Starting…';

    const ps = document.getElementById("progress-section");
    const fill = document.getElementById("progress-fill");
    const pct = document.getElementById("progress-pct");
    const stage = document.getElementById("progress-stage");
    const statusLine = document.getElementById("status-line");

    ps.style.display = "block";
    fill.style.width = "0%";
    fill.className = "progress-fill";
    pct.textContent = "0%";
    stage.textContent = "Downloading";
    statusLine.textContent = "Starting…";

    try {
      const resp = await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ urls })
      });
      const data = await resp.json();
      if (!resp.ok || data.error) {
        showError(data.error || "Failed to start download");
        ps.style.display = "none";
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        return;
      }
      currentTaskId = data.task_id;
      pollStatus(btn);
    } catch (err) {
      showError(err.message);
      ps.style.display = "none";
      btn.disabled = false;
      btn.textContent = "↓ Download All as MP3";
    }
  }

  async function pollStatus(btn) {
    if (!currentTaskId) return;

    const fill = document.getElementById("progress-fill");
    const pctEl = document.getElementById("progress-pct");
    const stage = document.getElementById("progress-stage");
    const statusLine = document.getElementById("status-line");

    try {
      const resp = await fetch(`/api/status/${currentTaskId}`);
      const data = await resp.json();

      const p = data.progress || 0;
      fill.style.width = p + "%";
      pctEl.textContent = p + "%";

      if (data.current_file) {
        statusLine.textContent = "↓ " + data.current_file;
      }
      if (data.total > 0) {
        stage.textContent = `Track ${data.completed || 0} / ${data.total}`;
      }

      if (data.status === "downloading" || data.status === "pending") {
        setTimeout(() => pollStatus(btn), 800);
      } else if (data.status === "finished") {
        fill.style.width = "100%";
        fill.classList.add("done");
        pctEl.textContent = "100%";
        stage.textContent = "Complete";
        statusLine.textContent = "All downloads finished ✓";
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
        setTimeout(() => {
          document.getElementById("progress-section").style.display = "none";
        }, 3000);
        refreshFiles();
      } else if (data.status === "error") {
        showError(data.error || "Download failed");
        document.getElementById("progress-section").style.display = "none";
        btn.disabled = false;
        btn.textContent = "↓ Download All as MP3";
      }
    } catch (err) {
      setTimeout(() => pollStatus(btn), 1500);
    }
  }

  async function refreshFiles() {
    try {
      const resp = await fetch("/api/files");
      const files = await resp.json();
      const section = document.getElementById("downloads-section");
      const list = document.getElementById("files-list");

      if (files.length === 0) {
        section.style.display = "none";
        return;
      }

      list.innerHTML = files.map(f =>
        `<div class="file-row">
          <span class="file-name">🎵 ${esc(f)}</span>
          <a href="/api/files/${encodeURIComponent(f)}" download>
            <button class="file-dl-btn btn-secondary">↓ Save</button>
          </a>
        </div>`
      ).join("");
      section.style.display = "block";
    } catch(e) { /* ignore */ }
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  // Load any existing files on page load
  refreshFiles();
</script>
</body>
</html>
